[project]
name = "ai-bank-phase1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.34,<1","sqlalchemy>=2,<3","alembic>=1.14,<2","psycopg[binary]>=3.2,<4","pydantic>=2.10,<3","pydantic-settings>=2.7,<3","requests>=2.32,<3"]
[project.optional-dependencies]
test=["pytest>=8.3,<10","httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
